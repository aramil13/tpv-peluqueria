# fly.toml app configuration file generated for tpv-peluqueria on 2026-05-23T19:00:48+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tpv-peluqueria'
primary_region = 'cdg'

[build]

[env]
  PORT = '8080'
  CORS_ORIGIN = '*'
  SYNC_DATA_DIR = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = 'data'
  destination = '/data'
