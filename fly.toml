app = "tpv-peluqueria-bridge"
primary_region = "cdg"

[http_service]
  internal_port = 3457
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "warn"
  DATA_DIR = "/data"
  PORT = "3457"
  BUSINESS_NAME = "Nymara Estilistas"
  BUSINESS_PHONE = "+34624143658"
  BUSINESS_ADDRESS = "Calle Antonio Machado, 11. 33420 Lugones. Siero"
  SYNC_URL = "https://nymaraestilistas.es/api"
  BRIDGE_API_KEY = "tpv-secret-2026"

[mounts]
  source = "data"
  destination = "/data"

[deploy]
