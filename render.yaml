services:
  - type: web
    name: tpv-peluqueria-sync
    runtime: node
    region: ohio
    plan: free
    buildCommand: ""
    startCommand: node sync-helper.js
    healthCheckPath: /health
    envVars:
      - key: SYNC_PORT
        value: "3456"
      - key: SYNC_FILE
        value: /tmp/appointments.json
