services:
  - type: web
    name: tpv-peluqueria-whatsapp
    env: node
    buildCommand: npm install
    startCommand: node render-bridge.js
    envVars:
      - key: DATA_DIR
        value: /data
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: BUSINESS_NAME
        value: "Nymara Estilistas"
      - key: BUSINESS_PHONE
        sync: false
      - key: VERCEL_SYNC_URL
        sync: false
      - key: TZ
        value: "Europe/Madrid"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
