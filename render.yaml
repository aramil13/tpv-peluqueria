services:
  - type: web
    name: tpv-peluqueria-sync
    runtime: node
    region: ohio
    plan: free
    buildCommand: ""
    startCommand: node sync-helper.js
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SYNC_DATA_DIR
        value: /data
      - key: CORS_ORIGIN
        value: "*"
      - key: NODE_ENV
        value: production
    disk:
      name: sync-data
      mountPath: /data
      sizeGB: 1
