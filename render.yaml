services:
  - type: web
    name: tpv-peluqueria-booking
    env: node
    buildCommand: npm install
    startCommand: node sync-helper.js
    envVars:
      - key: CORS_ORIGIN
        value: "*"
      - key: SYNC_DATA_DIR
        value: /data
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
