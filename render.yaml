services:
  - type: web
    name: tpv-peluqueria-whatsapp
    env: node
    buildCommand: npm install
    startCommand: node render-bridge.js
    envVars:
      - key: DATA_DIR
        value: /data
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BUSINESS_NAME
        value: "Nymara Estilistas"
      - key: BUSINESS_PHONE
        sync: false
      - key: SYNC_URL
        sync: false
      - key: TZ
        value: "Europe/Madrid"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: tpv-peluqueria-sync
    env: node
    buildCommand: npm install
    startCommand: node sync-helper.js
    envVars:
      - key: PORT
        value: "3456"
      - key: HOST
        value: "0.0.0.0"
      - key: BUSINESS_NAME
        value: "Nymara Estilistas"
      - key: SYNC_FORWARD_URL
        sync: false
      - key: SYNC_FORWARD_KEY
        sync: false
      - key: TZ
        value: "Europe/Madrid"
